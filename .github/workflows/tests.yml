name: Tests

on:
  push:
  pull_request:

jobs:
  ingestion:
    name: Programme d'ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les bibliothèques
        run: pip install requests urllib3
      - name: Lancer les tests hors ligne
        run: python tests/test_ingestion.py
