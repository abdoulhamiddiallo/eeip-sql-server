; EEIP : configuration du programme d'ingestion
; Emplacement : C:\EEIP\config\eeip.ini (copie de ce modèle)
; Ce fichier contiendra vos clés : il reste sur votre poste et n'est jamais publié.

[sqlserver]
; le nom de votre instance, tel qu'il s'affiche dans SSMS
serveur = localhost
base = EEIP
pilote = ODBC Driver 18 for SQL Server

[entsoe]
; jeton de sécurité de la Transparency Platform (étape 1 du guide)
jeton = COLLEZ_ICI_VOTRE_JETON_ENTSOE

[rte]
; identifiants de votre application sur data.rte-france.com (étape 1 du guide)
id_client = COLLEZ_ICI_VOTRE_ID_CLIENT
secret_client = COLLEZ_ICI_VOTRE_SECRET_CLIENT

[http]
user_agent = EEIP-Ingestion/1.0
pause_entre_appels = 0.3
