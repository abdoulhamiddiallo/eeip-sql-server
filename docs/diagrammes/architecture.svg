 <text x="574" y="170" fill="#3D3305" font-size="11">Mesure : columnstore ordonné</text><text x="574" y="186" fill="#3D3305" font-size="11">partitions mensuelles</text><text x="574" y="202" fill="#3D3305" font-size="11">table temporelle (historique)</text>
 <text x="574" y="226" fill="#3D3305" font-size="11">Zone (temporelle), Filière,</text><text x="574" y="242" fill="#3D3305" font-size="11">Indicateur, Source, Série,</text><text x="574" y="258" fill="#3D3305" font-size="11">Frontière, Calendrier,</text><text x="574" y="274" fill="#3D3305" font-size="11">Fuseaux (heure d'été)</text>
 <text x="574" y="326" fill="#6B5A0A" font-size="10">FG_MESURE · FG_ARCHIVE</text>
 <rect x="765" y="124" width="185" height="104" rx="10" fill="#1D4A48"/><text x="777" y="146" font-weight="700" fill="#fff">mart</text><text x="777" y="166" fill="#B9DDD7" font-size="11">jour local, mix, prix,</text><text x="777" y="182" fill="#B9DDD7" font-size="11">échanges, CO2, panel</text><text x="777" y="212" fill="#7FB9B0" font-size="10">FG_MART · SWITCH</text>
 <rect x="765" y="238" width="185" height="104" rx="10" fill="#1D4A48"/><text x="777" y="260" font-weight="700" fill="#fff">api</text><text x="777" y="280" fill="#B9DDD7" font-size="11">séries en heure locale,</text><text x="777" y="296" fill="#B9DDD7" font-size="11">voyage dans le temps, JSON</text>
 <rect x="420" y="356" width="160" height="88" rx="10" fill="#14403E"/><text x="432" y="378" font-weight="700" fill="#fff">cfg</text><text x="432" y="398" fill="#B9DDD7" font-size="11">111 requêtes en JSON</text><text x="432" y="414" fill="#B9DDD7" font-size="11">filigranes</text>
 <rect x="590" y="356" width="160" height="88" rx="10" fill="#14403E"/><text x="602" y="378" font-weight="700" fill="#fff">dq</text><text x="602" y="398" fill="#B9DDD7" font-size="11">règles, 8 contrôles</text><text x="602" y="414" fill="#B9DDD7" font-size="11">anomalies par lot</text>
 <rect x="765" y="356" width="185" height="88" rx="10" fill="#14403E"/><text x="777" y="378" font-weight="700" fill="#fff">ops</text><text x="777" y="398" fill="#B9DDD7" font-size="11">lots, journal, paramètres,</text><text x="777" y="414" fill="#B9DDD7" font-size="11">fenêtre glissante</text>
</g>
