<text x="297" y="200" text-anchor="middle" font-size="12" fill="#E6FFFB">Python</text>
<g font-size="11" fill="#E6FFFB" text-anchor="middle">
<text x="297" y="228">fenêtres + filigrane</text><text x="297" y="246">tout en UTC</text><text x="297" y="264">empreinte SHA-256</text><text x="297" y="282">GZIP du brut</text><text x="297" y="300">cache par jeu</text><text x="297" y="318">fast_executemany</text><text x="297" y="350" font-weight="700">piloté par cfg</text>
</g>
