<text x="30" y="60" font-size="12.5" fill="#5B6B82">Quatre producteurs officiels, un programme d'ingestion, huit couches dans SQL Server, une couche analytique en heure locale</text>
<text x="30" y="98" font-size="11" font-weight="700" fill="#5B6B82" letter-spacing="1.5">SOURCES</text>
