 <rect x="30" y="354" width="160" height="70" rx="10" fill="#fff" stroke="#C9D8D4"/><rect x="30" y="354" width="6" height="70" rx="3" fill="#27AE60"/>
 <text x="46" y="378" font-weight="700" fill="#0A2324">Eurostat</text><text x="46" y="396" fill="#5B6B82" font-size="11">prix, bilans, CO2</text><text x="46" y="412" fill="#5B6B82" font-size="11">sans clé · JSON-stat</text>
