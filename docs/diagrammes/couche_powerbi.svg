<text x="772" y="338" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#FFEDE6" opacity="0.85" xml:space="preserve">format PBIR · EEIP.Report</text>
<rect x="30" y="392" width="940" height="58" rx="10" fill="#fff" stroke="#C9D8D4"/>
<text x="46" y="415" font-size="12" font-weight="700" fill="#0A2324">CHAQUE HEURE, SANS INTERVENTION</text>
