<text x="290" y="437" font-size="11.5" fill="#14302F"><tspan font-weight="700" fill="#0E9F8E">étape 1</tspan>  RTE, éCO2mix, ENTSO-E</text>
<text x="518" y="437" font-size="12" fill="#5B6B82">→</text>
<text x="540" y="437" font-size="11.5" fill="#14302F"><tspan font-weight="700" fill="#0E9F8E">étape 2</tspan>  bi.usp_Rafraichir</text>
<text x="738" y="437" font-size="12" fill="#5B6B82">→</text>
<text x="760" y="437" font-size="11.5" fill="#14302F"><tspan font-weight="700" fill="#E4572E">Power BI</tspan>  Actualiser : tout est à jour</text>
