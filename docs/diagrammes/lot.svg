<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Inter, sans-serif">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E9F8E"/></marker></defs>
<rect width="1000" height="400" fill="#F7FAF9"/>
<text x="30" y="38" font-size="20" font-weight="700" fill="#0A2324">La vie d'un lot</text>
<text x="30" y="60" font-size="12.5" fill="#5B6B82">Pour chaque jeu de données, fenêtre par fenêtre ; une fenêtre en échec arrête sa requête, jamais le lot</text>
<g font-size="12" text-anchor="middle">
 <rect x="30" y="95" width="120" height="96" rx="10" fill="#0A2324"/><text x="90" y="125" fill="#fff" font-weight="700">1. Ouvrir</text><text x="90" y="145" fill="#B9DDD7" font-size="10.5">ops.usp_Lot_Ouvrir</text><text x="90" y="161" fill="#B9DDD7" font-size="10.5">lit le catalogue</text><text x="90" y="177" fill="#B9DDD7" font-size="10.5">et les filigranes</text>
 <rect x="170" y="95" width="120" height="96" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="230" y="125" fill="#0A2324" font-weight="700">2. Fenêtres</text><text x="230" y="145" fill="#5B6B82" font-size="10.5">filigrane moins</text><text x="230" y="161" fill="#5B6B82" font-size="10.5">recouvrement,</text><text x="230" y="177" fill="#5B6B82" font-size="10.5">jusqu'à J+2</text>
 <rect x="310" y="95" width="120" height="96" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="370" y="125" fill="#0A2324" font-weight="700">3. Appeler</text><text x="370" y="145" fill="#5B6B82" font-size="10.5">réessais 2, 4, 8, 16 s</text><text x="370" y="161" fill="#5B6B82" font-size="10.5">cache partagé</text><text x="370" y="177" fill="#5B6B82" font-size="10.5">secrets masqués</text>
 <rect x="450" y="95" width="120" height="96" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="510" y="125" fill="#0A2324" font-weight="700">4. Ranger</text><text x="510" y="145" fill="#5B6B82" font-size="10.5">SHA-256</text><text x="510" y="161" fill="#5B6B82" font-size="10.5">GZIP dans raw</text><text x="510" y="177" fill="#5B6B82" font-size="10.5">une fois par URL</text>
 <rect x="590" y="95" width="120" height="96" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="650" y="125" fill="#0A2324" font-weight="700">5. Normaliser</text><text x="650" y="145" fill="#5B6B82" font-size="10.5">JSON, XML, JSON-stat</text><text x="650" y="161" fill="#5B6B82" font-size="10.5">vers UTC</text><text x="650" y="177" fill="#5B6B82" font-size="10.5">stg.Mesure</text>
 <rect x="730" y="95" width="120" height="96" rx="10" fill="#F2C12E"/><text x="790" y="125" fill="#0A2324" font-weight="700">6. Intégrer</text><text x="790" y="145" fill="#3D3305" font-size="10.5">core.usp_Mesure</text><text x="790" y="161" fill="#3D3305" font-size="10.5">_Integrer : révise,</text><text x="790" y="177" fill="#3D3305" font-size="10.5">insère, historise</text>
 <rect x="870" y="95" width="105" height="96" rx="10" fill="#0E9F8E"/><text x="922" y="125" fill="#fff" font-weight="700">7. Fermer</text><text x="922" y="145" fill="#E6FFFB" font-size="10.5">agrégats du jour</text><text x="922" y="161" fill="#E6FFFB" font-size="10.5">contrôles dq</text><text x="922" y="177" fill="#E6FFFB" font-size="10.5">statut du lot</text>
</g>
<g stroke="#0E9F8E" stroke-width="2" fill="none" marker-end="url(#f)"><path d="M150,143 L168,143"/><path d="M290,143 L308,143"/><path d="M430,143 L448,143"/><path d="M570,143 L588,143"/><path d="M710,143 L728,143"/><path d="M850,143 L868,143"/></g>
<path d="M790,195 C790,260 300,260 300,197" stroke="#9DB3AE" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#f)"/>
<text x="545" y="255" text-anchor="middle" font-size="11" fill="#5B6B82">fenêtre suivante : le filigrane avance, un chargement interrompu reprend exactement où il s'était arrêté</text>
<g font-size="11.5" fill="#0A2324">
 <rect x="30" y="290" width="300" height="84" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="46" y="314" font-weight="700">Réponse identique ?</text><text x="46" y="334" fill="#5B6B82" font-size="11">Même empreinte qu'au dernier succès :</text><text x="46" y="352" fill="#5B6B82" font-size="11">statut INCHANGE, rien n'est réécrit.</text>
 <rect x="350" y="290" width="300" height="84" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="366" y="314" font-weight="700">Pas de clé ?</text><text x="366" y="334" fill="#5B6B82" font-size="11">ENTSO-E ou RTE sans clé : SANS_CLE,</text><text x="366" y="352" fill="#5B6B82" font-size="11">les autres sources continuent.</text>
 <rect x="670" y="290" width="300" height="84" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="686" y="314" font-weight="700">Valeur moins bonne ?</text><text x="686" y="334" fill="#5B6B82" font-size="11">Le temps réel n'écrase jamais un chiffre</text><text x="686" y="352" fill="#5B6B82" font-size="11">consolidé ou définitif.</text>
</g>
</svg>
