<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Inter, sans-serif">
<rect width="1000" height="560" fill="#F7FAF9"/>
<text x="30" y="38" font-size="20" font-weight="700" fill="#0A2324">Le modèle en étoile</text>
<text x="30" y="60" font-size="12.5" fill="#5B6B82">Une seule table de faits pour toutes les granularités : une mesure = une série + un instant UTC</text>
<g stroke="#9DB3AE" stroke-width="1.5">
 <line x1="500" y1="300" x2="200" y2="140"/><line x1="500" y1="300" x2="500" y2="135"/><line x1="500" y1="300" x2="800" y2="140"/>
 <line x1="500" y1="300" x2="160" y2="330"/><line x1="500" y1="300" x2="840" y2="330"/><line x1="500" y1="300" x2="300" y2="470"/><line x1="500" y1="300" x2="700" y2="470"/>
</g>
<rect x="390" y="210" width="220" height="190" rx="14" fill="#0A2324"/>
<text x="500" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#F2C12E">core.Mesure</text>
<g font-size="11.5" fill="#D5ECE8"><text x="408" y="264">SerieId, InstantUtc (clé)</text><text x="408" y="282">Valeur  decimal(19,6)</text><text x="408" y="300">Qualite  T · C · D · P · E</text><text x="408" y="318">LotId</text><text x="408" y="336">ValidFrom, ValidTo</text></g>
<text x="500" y="364" text-anchor="middle" font-size="10.5" fill="#7FB9B0">columnstore ordonné · mensuel</text>
<text x="500" y="382" text-anchor="middle" font-size="10.5" fill="#7FB9B0">+ core.MesureHistorique</text>
<g font-size="12">
 <rect x="110" y="95" width="180" height="88" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="124" y="118" font-weight="700" fill="#0A2324">core.Serie</text><text x="124" y="138" font-size="11" fill="#5B6B82">source + code stable</text><text x="124" y="154" font-size="11" fill="#5B6B82">zone, filière, contrepartie</text><text x="124" y="170" font-size="11" fill="#5B6B82">granularité, pas</text>
 <rect x="410" y="85" width="180" height="70" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="424" y="108" font-weight="700" fill="#0A2324">core.Indicateur</text><text x="424" y="128" font-size="11" fill="#5B6B82">21 indicateurs, 7 thèmes</text><text x="424" y="144" font-size="11" fill="#5B6B82">unité, nature</text>
 <rect x="710" y="95" width="180" height="88" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="724" y="118" font-weight="700" fill="#0A2324">core.Source</text><text x="724" y="138" font-size="11" fill="#5B6B82">RTE, ODRE, ENTSOE,</text><text x="724" y="154" font-size="11" fill="#5B6B82">EUROSTAT · priorité</text>
 <rect x="40" y="290" width="200" height="88" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="54" y="313" font-weight="700" fill="#0A2324">core.Zone (temporelle)</text><text x="54" y="333" font-size="11" fill="#5B6B82">pays, zones de prix, régions</text><text x="54" y="349" font-size="11" fill="#5B6B82">EIC, Eurostat, fuseau</text><text x="54" y="365" font-size="11" fill="#5B6B82">rôles : zone et contrepartie</text>
 <rect x="760" y="290" width="200" height="88" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="774" y="313" font-weight="700" fill="#0A2324">core.Filiere</text><text x="774" y="333" font-size="11" fill="#5B6B82">31 filières, 13 familles</text><text x="774" y="349" font-size="11" fill="#5B6B82">renouvelable, fossile, CO2</text><text x="774" y="365" font-size="11" fill="#5B6B82">une couleur par filière</text>
 <rect x="200" y="440" width="200" height="80" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="214" y="463" font-weight="700" fill="#0A2324">core.FuseauDecalage</text><text x="214" y="483" font-size="11" fill="#5B6B82">heure d'été et d'hiver</text><text x="214" y="499" font-size="11" fill="#5B6B82">UTC vers heure locale</text>
 <rect x="600" y="440" width="200" height="80" rx="10" fill="#fff" stroke="#C9D8D4"/><text x="614" y="463" font-weight="700" fill="#0A2324">core.Calendrier</text><text x="614" y="483" font-size="11" fill="#5B6B82">1990 à 2040, saisons</text><text x="614" y="499" font-size="11" fill="#5B6B82">jours ouvrés</text>
</g>
<g font-size="10.5" fill="#5B6B82"><text x="40" y="410">Alias : ZoneAlias, FiliereAlias</text><text x="40" y="426">traduisent chaque code source</text><text x="830" y="410">Frontiere : 19 paires</text><text x="830" y="426">de zones voisines</text></g>
</svg>
